<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="32" height="32">
  <style>
    .paper { fill: #f5f1e8; }
    .paper-edge { fill: #ddd8cc; }
    .line { stroke: #b0a898; }
    .stamp { fill: #2563eb; }
    .stamp-inner { fill: #1d4ed8; }
    .handle { stroke: #7c4a1e; fill: none; }
    .lens-rim { stroke: #d97706; fill: none; }
    .lens-fill { fill: #dbeafe; fill-opacity: 0.6; }
    .lens-shine { fill: #eff6ff; fill-opacity: 0.7; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #e8e4d8; }
      .paper-edge { fill: #ccc8bb; }
      .line { stroke: #a09a8e; }
      .lens-fill { fill: #bfdbfe; fill-opacity: 0.55; }
    }
  </style>

  <!-- Paper body -->
  <rect class="paper" x="180" y="110" width="280" height="360" rx="10"/>

  <!-- Folded corner top-right -->
  <polygon class="paper-edge" points="390,110 460,110 460,180 390,110"/>
  <polygon class="paper" points="390,110 460,180 390,180"/>

  <!-- Ruled lines -->
  <line class="line" x1="215" y1="200" x2="425" y2="200" stroke-width="8" stroke-linecap="round"/>
  <line class="line" x1="215" y1="240" x2="425" y2="240" stroke-width="8" stroke-linecap="round"/>
  <line class="line" x1="215" y1="280" x2="425" y2="280" stroke-width="8" stroke-linecap="round"/>
  <line class="line" x1="215" y1="320" x2="380" y2="320" stroke-width="8" stroke-linecap="round"/>

  <!-- Approval stamp -->
  <circle class="stamp" cx="360" cy="400" r="46"/>
  <circle class="stamp-inner" cx="360" cy="400" r="34"/>
  <polyline points="340,400 354,416 382,384" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifying glass -->
  <circle class="lens-fill" cx="430" cy="290" r="110"/>
  <circle class="lens-shine" cx="400" cy="258" r="28"/>
  <circle class="lens-rim" cx="430" cy="290" r="110" stroke-width="22" fill="none"/>

  <!-- Handle -->
  <line class="handle" x1="512" y1="372" x2="570" y2="540" stroke-width="32" stroke-linecap="round"/>
</svg>
